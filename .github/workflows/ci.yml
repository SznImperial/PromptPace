name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs scripts/verify.sh: no tracked secrets, no key-shaped strings, a
      # clean typecheck, all tests green, the admin path reads no forwarded
      # headers, and the proxy still binds to 127.0.0.1 by default.
      - name: Verify
        run: npm run verify
